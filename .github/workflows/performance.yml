name: Performance Testing

on:
  schedule:
    - cron: '0 3 * * 0' # Weekly on Sunday at 3 AM
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd spark-client-web
          npm ci

      - name: Build application
        run: |
          cd spark-client-web
          npm run build

      - name: Start application
        run: |
          cd spark-client-web
          npm start &
          sleep 30

      - name: Run Lighthouse CI
        run: |
          cd spark-client-web
          npx lhci autorun

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v3
        with:
          name: lighthouse-results
          path: spark-client-web/.lighthouseci/

  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create load test script
        run: |
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export let options = {
            stages: [
              { duration: '2m', target: 100 }, // Ramp up
              { duration: '5m', target: 100 }, // Stay at 100 users
              { duration: '2m', target: 200 }, // Ramp up to 200 users
              { duration: '5m', target: 200 }, // Stay at 200 users
              { duration: '2m', target: 0 },   // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<2000'], // 95% of requests under 2s
              http_req_failed: ['rate<0.1'],     // Error rate under 10%
            },
          };

          export default function() {
            // Test homepage
            let response = http.get('https://spark-client-web-xxx.run.app/');
            check(response, {
              'homepage status is 200': (r) => r.status === 200,
              'homepage response time < 2s': (r) => r.timings.duration < 2000,
            });

            sleep(1);

            // Test API endpoints
            response = http.get('https://us-central1-abhi-yt.cloudfunctions.net/healthCheck');
            check(response, {
              'API health check status is 200': (r) => r.status === 200,
              'API response time < 1s': (r) => r.timings.duration < 1000,
            });

            sleep(1);
          }
          EOF

      - name: Run load test
        run: k6 run load-test.js

  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd spark-client-web
          npm ci

      - name: Install bundle analyzer
        run: |
          cd spark-client-web
          npm install --save-dev @next/bundle-analyzer

      - name: Build with bundle analysis
        run: |
          cd spark-client-web
          ANALYZE=true npm run build

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v3
        with:
          name: bundle-analysis
          path: spark-client-web/.next/analyze/

  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd spark-client-web
          npm ci

      - name: Install clinic.js
        run: |
          npm install -g clinic

      - name: Run memory profiling
        run: |
          cd spark-client-web
          clinic doctor -- node server.js &
          sleep 60
          pkill -f "node server.js"

      - name: Upload profiling results
        uses: actions/upload-artifact@v3
        with:
          name: memory-profiling
          path: spark-client-web/

  performance-notification:
    name: Performance Notification
    runs-on: ubuntu-latest
    needs: [lighthouse-ci, load-testing, bundle-analysis, memory-profiling]
    if: always()
    steps:
      - name: Notify performance team
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          channel: '#performance'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
